name: Installer cold start

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: Also verify this selected DSH version (empty runs default startup only)
        type: string
        default: '0.2.3-alpha.2'
      include_macos:
        description: Also verify Apple Silicon and Intel Mac installers
        type: boolean
        default: false
      platforms:
        description: Platforms to verify
        type: choice
        options: [windows-linux, windows, linux, macos]
        default: windows-linux
      source_run_id:
        description: Reuse immutable installers from this workflow run (empty builds current source)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      dsh_modes: ${{ steps.matrix.outputs.dsh_modes }}
    steps:
      - name: Select package and page-verification matrix
        id: matrix
        env:
          INCLUDE_MACOS: ${{ inputs.include_macos }}
          DSH_VERSION: ${{ inputs.dsh_version }}
          PLATFORMS: ${{ inputs.platforms }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PY_MATRIX'
          import json, os
          source_run = os.environ["SOURCE_RUN_ID"]
          if source_run and not source_run.isdecimal():
              raise SystemExit("source_run_id must be a numeric workflow run ID")
          platforms = os.environ["PLATFORMS"]
          packages = []
          if platforms in ("windows-linux", "windows"):
              packages.append(dict(runner="windows-2025", artifact="installers-windows-x64", extension="exe", arch="x86_64"))
          if platforms in ("windows-linux", "linux"):
              packages.append(dict(runner="ubuntu-26.04", artifact="installers-linux-x64", extension="deb", arch="x86_64"))
          if platforms == "macos" or os.environ["INCLUDE_MACOS"] == "true":
              packages.extend([
                  dict(runner="xcode-27", artifact="installers-macos-arm64", extension="dmg", arch="arm64"),
                  dict(runner="macos-26-intel", artifact="installers-macos-intel", extension="dmg", arch="x86_64"),
              ])
          modes = ["default", "regression"] if os.environ["DSH_VERSION"] else ["default"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("packages=" + json.dumps(packages), file=output)
              print("dsh_modes=" + json.dumps(modes), file=output)
          PY_MATRIX
      - name: Record reused installer provenance
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          sha=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')
          printf 'Installer binaries: [run %s](https://github.com/%s/actions/runs/%s), source commit `%s`.\n' "$SOURCE_RUN_ID" "$GH_REPO" "$SOURCE_RUN_ID" "$sha" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package / ${{ matrix.runner }}
    needs: plan
    if: inputs.source_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Parse Windows page-test scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in @('scripts/smoke-windows-installer.ps1', 'scripts/assert-windows-page.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          install: false
      - name: Read package versions
        id: versions
        shell: bash
        run: |
          node -p '"app=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
          sed -nE "s/^const NODE_VER = '([^']+)'$/node=\1/p" scripts/bundle-runtime.mjs >> "$GITHUB_OUTPUT"
          sed -nE "s/^const DSH_VERSION = '([^']+)'$/dsh=\1/p" scripts/bundle-runtime.mjs >> "$GITHUB_OUTPUT"
      - name: Cache bundled runtime
        uses: actions/cache@v6
        with:
          path: src-tauri/resources/runtime
          key: dsh-runtime-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.dsh }}-${{ hashFiles('scripts/bundle-runtime.mjs') }}
      - name: Check source and build both installers
        shell: bash
        env:
          EXTENSION: ${{ matrix.extension }}
          APP_VERSION: ${{ steps.versions.outputs.app }}
          NODE_VERSION: ${{ steps.versions.outputs.node }}
          DSH_VERSION: ${{ steps.versions.outputs.dsh }}
          TAURI_BUILD_VERBOSE: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          set -euo pipefail
          test -n "$APP_VERSION" && test -n "$NODE_VERSION" && test -n "$DSH_VERSION"
          test "$APP_VERSION" = "$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          pnpm install --frozen-lockfile
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          pnpm run lint
          pnpm run format:check
          ./scripts/build-release.sh two
          mkdir -p installers
          printf 'app=%s\nnode=%s\nbundled_dsh=%s\n' "$APP_VERSION" "$NODE_VERSION" "$DSH_VERSION" > installers/versions.env
          shopt -s nullglob
          for variant in plain bundled; do
            files=("dist/release/$variant/"*."$EXTENSION")
            test "${#files[@]}" -eq 1
            test -s "${files[0]}"
            mkdir -p "installers/$variant"
            cp "${files[0]}" "installers/$variant/"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: installers
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows x64 / ${{ matrix.variant }} / ${{ matrix.dsh_mode }}
    needs: [plan, package]
    if: ${{ !cancelled() && (inputs.platforms == 'windows-linux' || inputs.platforms == 'windows') }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, bundled]
        dsh_mode: ${{ fromJSON(needs.plan.outputs.dsh_modes) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: installers-windows-x64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          path: installers
          digest-mismatch: error
      - name: Read installer versions
        id: versions
        shell: bash
        run: cat installers/versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: matrix.variant == 'plain'
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - name: Verify actual DSH workspace, plugin navigation and refresh
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
          DSH_MODE: ${{ matrix.dsh_mode }}
          APP_VERSION: ${{ steps.versions.outputs.app }}
          NODE_VERSION: ${{ steps.versions.outputs.node }}
          BUNDLED_DSH_VERSION: ${{ steps.versions.outputs.bundled_dsh }}
          DSH_SMOKE_VERSION: ${{ matrix.dsh_mode == 'regression' && inputs.dsh_version || '' }}
        run: |
          $files = @(Get-ChildItem -LiteralPath "installers/$env:VARIANT" -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected one NSIS installer' }
          & ./scripts/smoke-windows-installer.ps1 -Installer $files[0].FullName -Variant $env:VARIANT `
            -AppVersion $env:APP_VERSION -BundledDshVersion $env:BUNDLED_DSH_VERSION `
            -NodeVersion $env:NODE_VERSION -ScreenshotPath "screenshots/windows-x64-$env:VARIANT-$env:DSH_MODE.png"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: page-windows-x64-${{ matrix.variant }}-${{ matrix.dsh_mode }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

  linux:
    name: Linux x64 / ${{ matrix.variant }} / ${{ matrix.dsh_mode }}
    needs: [plan, package]
    if: ${{ !cancelled() && (inputs.platforms == 'windows-linux' || inputs.platforms == 'linux') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, bundled]
        dsh_mode: ${{ fromJSON(needs.plan.outputs.dsh_modes) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: installers-linux-x64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          path: installers
          digest-mismatch: error
      - name: Read installer versions
        id: versions
        run: cat installers/versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: matrix.variant == 'plain'
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - name: Verify actual WebKitGTK content and toolbar refresh
        env:
          VARIANT: ${{ matrix.variant }}
          APP_VERSION: ${{ steps.versions.outputs.app }}
          NODE_VERSION: ${{ steps.versions.outputs.node }}
          BUNDLED_DSH_VERSION: ${{ steps.versions.outputs.bundled_dsh }}
          DSH_SMOKE_VERSION: ${{ matrix.dsh_mode == 'regression' && inputs.dsh_version || '' }}
          DSH_SCREENSHOT_PATH: ${{ github.workspace }}/screenshots/linux-x64-${{ matrix.variant }}-${{ matrix.dsh_mode }}.png
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$PWD/installers/$VARIANT/"*.deb)
          test "${#packages[@]}" -eq 1
          bash scripts/smoke-linux-installer.sh "${packages[0]}" "$VARIANT" "$APP_VERSION" "$NODE_VERSION" "$BUNDLED_DSH_VERSION"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: page-linux-x64-${{ matrix.variant }}-${{ matrix.dsh_mode }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

  macos:
    name: macOS ${{ matrix.arch }} / ${{ matrix.variant }} / ${{ matrix.dsh_mode }}
    needs: [plan, package]
    if: ${{ !cancelled() && (inputs.platforms == 'macos' || inputs.include_macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        variant: [plain, bundled]
        dsh_mode: ${{ fromJSON(needs.plan.outputs.dsh_modes) }}
        include:
          - { arch: arm64, runner: macos-26, artifact: installers-macos-arm64 }
          - { arch: x86_64, runner: macos-26-intel, artifact: installers-macos-intel }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          path: installers
          digest-mismatch: error
      - name: Read installer versions
        id: versions
        run: cat installers/versions.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: matrix.variant == 'plain'
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - name: Verify real macOS page and capture the client window
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          DSH_MODE: ${{ matrix.dsh_mode }}
          APP_VERSION: ${{ steps.versions.outputs.app }}
          NODE_VERSION: ${{ steps.versions.outputs.node }}
          BUNDLED_DSH_VERSION: ${{ steps.versions.outputs.bundled_dsh }}
          DSH_SMOKE_VERSION: ${{ matrix.dsh_mode == 'regression' && inputs.dsh_version || '' }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          shopt -s nullglob
          dmgs=("$PWD/installers/$VARIANT/"*.dmg)
          test "${#dmgs[@]}" -eq 1
          bash scripts/smoke-macos-installer.sh "${dmgs[0]}" "$APP_VERSION" "$GITHUB_WORKSPACE/screenshots/macos-$ARCH-$VARIANT-$DSH_MODE.png" "$VARIANT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: page-macos-${{ matrix.arch }}-${{ matrix.variant }}-${{ matrix.dsh_mode }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn
