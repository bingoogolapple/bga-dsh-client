name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: 校验发布版本
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.versions.outputs.app_version }}
      node_ver: ${{ steps.versions.outputs.node_ver }}
      dsh_version: ${{ steps.versions.outputs.dsh_version }}
      pnpm_version: ${{ steps.versions.outputs.pnpm_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 读取 App 和运行时版本
        id: versions
        shell: python
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          package = json.loads(Path("package.json").read_text())
          cargo = tomllib.loads(Path("src-tauri/Cargo.toml").read_text())
          version = conf["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid application version: {version}")
          if version != package["version"] or version != cargo["package"]["version"]:
              raise SystemExit("App versions differ in tauri.conf.json, package.json and Cargo.toml")
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match v{version}")
          runtime = Path("scripts/bundle-runtime.mjs").read_text()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"app_version={version}", file=output)
              for key in ("NODE_VER", "DSH_VERSION", "PNPM_VERSION"):
                  match = re.search(rf"^const {key} = '([^'\r\n]+)'$", runtime, re.M)
                  if not match:
                      raise SystemExit(f"Missing {key} in bundle-runtime.mjs")
                  print(f"{key.lower()}={match[1]}", file=output)
          print(f"Application version: {version}")

  build:
    name: 构建 / ${{ matrix.platform }}
    needs: prepare
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    outputs:
      macos_arm: ${{ steps.artifact.outputs.macos_arm }}
      macos_intel: ${{ steps.artifact.outputs.macos_intel }}
      linux: ${{ steps.artifact.outputs.linux }}
      windows: ${{ steps.artifact.outputs.windows }}
    # 平台矩阵：macos-26 为 Apple Silicon（arm64），macos-26-intel 为 Intel（x86_64），
    # ubuntu-26.04 为 Linux（x64，产出 deb），windows-latest 为 Win x64（产出 NSIS exe）。
    # 每平台均构建 plain + bundled 双版本（见「构建双版本」步骤）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            key: macos_arm
            arch: aarch64
          - platform: macos-26-intel
            key: macos_intel
            arch: x86_64
          - platform: ubuntu-26.04
            key: linux
            arch: x86_64
          - platform: windows-latest
            key: windows
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Linux 打包的系统依赖（Tauri v2 官方清单）：webkit2gtk-4.1 + GTK3 + tray + 图标渲染，
      # 以及 xdg-utils（linuxdeploy/AppImage 及部分打包脚本需要）。仅 ubuntu 需要
      # （Windows runner 预装 WebView2 与 MSVC 工具链，无需额外安装）。
      # tray 使用 Ubuntu 提供的 libayatana-appindicator3-dev。
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=3 update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev xdg-utils

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # 必须显式指定与仓库根目录 rust-toolchain.toml 相同的 channel（1.97），
          # 否则 dtolnay 会把组件装到默认 stable，而 rust-toolchain.toml 会把
          # 实际生效 toolchain 覆盖为 1.97，导致 `cargo fmt --check` 仍然报
          # "'cargo-fmt' is not installed"。
          toolchain: 1.97
          components: rustfmt, clippy

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        # Node24 runtime 版本；version: 9 为 CI 构建工具版本，与
        # pnpm-lock.yaml 的 lockfileVersion 匹配（非内置运行时版本）。
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 安装 Node.js
        # Node24 runtime 版本；node-version: 22 为 CI 构建环境版本
        # （LTS，与内置运行时版本相互独立）。
        # 本项目 package.json 无 packageManager 字段，自动缓存检测不会触发，
        # 故显式声明 cache: pnpm 与 lockfile 路径。
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 内置 Node.js 运行时缓存：key 由版本常量 + 架构 + 生成脚本内容决定，
      # 命中直接用；未命中则本次生成后存入。注意不设 restore-keys 兜底，
      # 避免恢复出旧版本 runtime——版本漂移时 build-release.sh 会比较 manifest 重建。
      # key 必须含 matrix.platform：darwin-x64 与 linux-x64 的 arch 都是 x86_64，
      # 不带平台会互相抢同一个缓存键（每次各白重建一轮）+ 依赖时序互相覆盖。
      - name: 缓存内置 Node.js 运行时
        # Node24 runtime 版本
        uses: actions/cache@v6
        with:
          path: src-tauri/resources/runtime
          key: dsh-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.prepare.outputs.node_ver }}-${{ needs.prepare.outputs.dsh_version }}-${{ needs.prepare.outputs.pnpm_version }}-${{ hashFiles('scripts/bundle-runtime.mjs') }}

      - name: 运行 Rust 单元测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 依赖安全审计（cargo audit）
        # 官方最新 tag 仍用已弃用的 node20 runtime，故锁定到 main 分支上已
        # 升级 node24 runtime 的 commit（官方发新版 tag 后可切回 @vX）。
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Cargo.lock 位于 src-tauri/ 下（Tauri 工程），不在仓库根目录
          working-directory: src-tauri
          # 忽略以下 17 个「无维护/unsound」类 informational 警告（均为 Tauri v2
          # 上游锁定依赖，应用层无法升级，升级 Tauri 后应随之移除）：
          #  - RUSTSEC-2024-0413/0416/0412/0418/0411/0417/0414/0415/0420/0419：
          #    gtk-rs GTK3 bindings（atk/gdk/gtk/gdkx11/gdkwayland 等），Tauri 在
          #    Linux 依赖 webkit2gtk-4.1 引入，官方未提供可替换的 GTK4 绑定
          #  - RUSTSEC-2024-0370：proc-macro-error（gtk3-macros 传递依赖）
          #  - RUSTSEC-2025-0081/0075/0080/0100/0098：unic-*（urlpattern → tauri-utils 传递依赖）
          #  - RUSTSEC-2024-0429：glib VariantStrIter 内存安全（需 >=0.20，但 gtk 0.18
          #    配套锁定 glib 0.18；本项目未使用该 API，风险不可达）
          # 新出现的漏洞（vulnerabilities）不受影响，仍会失败阻止发布。
          ignore: RUSTSEC-2024-0413,RUSTSEC-2024-0416,RUSTSEC-2024-0412,RUSTSEC-2024-0418,RUSTSEC-2024-0411,RUSTSEC-2024-0417,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0420,RUSTSEC-2024-0419,RUSTSEC-2024-0370,RUSTSEC-2025-0081,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0100,RUSTSEC-2025-0098,RUSTSEC-2024-0429

      - name: 代码风格与静态检查
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      # 前端质量门禁：ESLint（含 XSS 相关规则）+ Prettier 格式校验。
      # 原先只有 `node --check`（仅语法校验，查不出未定义变量、死代码、
      # innerHTML 拼接等问题）。ui/ 虽无打包器，但脚本量已上千行，
      # 需要真正的 lint 来兜住质量。依赖由「安装依赖」步骤的 pnpm install 提供。
      - name: 前端代码检查（ESLint）
        run: pnpm run lint

      - name: 前端格式检查（Prettier）
        run: pnpm run format:check

      # ui/ 是纯静态前端（frontendDist: ../ui），无需单独构建；
      # tauri build 按 runner 宿主架构自动产出对应架构产物。
      # 双版本：plain（现状，无内置运行时）+ bundled（内置 Node.js，离线可用）。
      # two 模式每轮构建后立即归档到 dist/release/{plain,bundled}，避免共用一个
      # target/release/bundle 输出目录而互相覆盖；bundled 首跑会自动下载 Node 并
      # npm ci 安装 dsh（scripts/bundle-runtime.mjs），产物命名加 -bundled 后缀区分。
      # shell: bash —— build-release.sh 是 bash 脚本（Windows 走 Git Bash）。
      #
      # SENTRY_DSN：以环境变量注入，telemetry.rs 用 option_env! 在**编译期**读取。
      # 未设置时编译出的二进制里遥测模块整体空转（不联网、不链接上报路径），
      # 因此 fork 本仓库的人默认不会把数据发到作者的 Sentry 项目。
      # 只有 push tag 的正式发布才注入（secrets 在 fork 的 PR 里不可用，
      # 正好实现"仅官方发布版带遥测能力"）。
      - name: 构建双版本（plain + bundled）
        shell: bash
        env:
          SENTRY_DSN: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.SENTRY_DSN || '' }}
          # Tauri 仅在详细日志中输出 DMG 脚本的 stdout 和 stderr。
          TAURI_BUILD_VERBOSE: ${{ runner.os == 'macOS' && matrix.arch == 'x86_64' && '1' || '0' }}
        run: ./scripts/build-release.sh two

      - name: 整理安装包和 macOS ZIP
        shell: bash
        env:
          PLATFORM: ${{ matrix.key }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/release-artifacts.py stage "$PLATFORM" "$APP_VERSION" release-files
          else
            python3 scripts/release-artifacts.py stage "$PLATFORM" "$APP_VERSION" release-files
          fi

      - name: 上传安装包
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ github.run_attempt }}
          path: release-files
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: 记录不可变的产物 ID
        id: artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.key }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          printf '%s=%s\n' "$PLATFORM" "$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

  integrity:
    name: 校验四平台产物完整性
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_ids: ${{ steps.ids.outputs.all }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 检查产物 ID
        id: ids
        shell: bash
        env:
          MAC_ARM: ${{ needs.build.outputs.macos_arm }}
          MAC_INTEL: ${{ needs.build.outputs.macos_intel }}
          LINUX: ${{ needs.build.outputs.linux }}
          WINDOWS: ${{ needs.build.outputs.windows }}
        run: |
          ids="$MAC_ARM,$MAC_INTEL,$LINUX,$WINDOWS"
          [[ "$ids" =~ ^[0-9]+,[0-9]+,[0-9]+,[0-9]+$ ]]
          printf 'all=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.ids.outputs.all }}
          path: release-files
          merge-multiple: true
          digest-mismatch: error
      - name: 检查 12 个预期附件
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: python3 scripts/release-artifacts.py verify "$APP_VERSION" release-files

  smoke:
    name: 冷启动 / ${{ matrix.runner }} / ${{ matrix.variant }}
    needs: [prepare, build, integrity]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macos_arm, macos_intel, linux, windows]
        variant: [plain, bundled]
        include:
          - platform: macos_arm
            runner: macos-26
            arch: aarch64
            dmg_arch: aarch64
          - platform: macos_intel
            runner: macos-26-intel
            arch: x86_64
            dmg_arch: x64
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      NODE_VERSION: ${{ needs.prepare.outputs.node_ver }}
      BUNDLED_DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs[matrix.platform] }}
          path: release-files
          digest-mismatch: error
      - uses: actions/setup-node@v7
        if: matrix.variant == 'plain'
        with:
          node-version: ${{ needs.prepare.outputs.node_ver }}
          package-manager-cache: false
      - name: Windows 安装和冷启动
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $suffix = if ($env:VARIANT -eq 'bundled') { '-bundled' } else { '' }
          $installer = Join-Path $PWD "release-files/DeepSeekHarness_${env:APP_VERSION}_x64-setup${suffix}.exe"
          & ./scripts/smoke-windows-installer.ps1 -Installer $installer -Variant $env:VARIANT `
            -AppVersion $env:APP_VERSION -NodeVersion $env:NODE_VERSION -BundledDshVersion $env:BUNDLED_DSH_VERSION
      - name: macOS 安装、ZIP 校验和冷启动
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DMG_ARCH: ${{ matrix.dmg_arch }}
        run: |
          suffix=""
          if [[ "$VARIANT" == bundled ]]; then suffix="-bundled"; fi
          dmg="$PWD/release-files/DeepSeekHarness_${APP_VERSION}_${DMG_ARCH}${suffix}.dmg"
          zip="$PWD/release-files/DeepSeek-Harness${suffix}-${ARCH}-v${APP_VERSION}.zip"
          bash scripts/smoke-macos-installer.sh "$dmg" "$APP_VERSION" "" "$VARIANT" "$zip"
      - name: Ubuntu 24.04 安装和冷启动
        if: runner.os == 'Linux'
        shell: bash
        run: |
          suffix=""
          if [[ "$VARIANT" == bundled ]]; then suffix="-bundled"; fi
          deb="$PWD/release-files/DeepSeekHarness_${APP_VERSION}_amd64${suffix}.deb"
          bash scripts/smoke-linux-installer.sh "$deb" "$VARIANT" "$APP_VERSION" "$NODE_VERSION" "$BUNDLED_DSH_VERSION"

  publish:
    name: 统一发布 GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, integrity, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.integrity.outputs.artifact_ids }}
          path: release-files
          merge-multiple: true
          digest-mismatch: error
      - name: 核对产物并发布
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-artifacts.py verify "$APP_VERSION" release-files
          bash scripts/publish-release.sh "$RELEASE_TAG" release-files
