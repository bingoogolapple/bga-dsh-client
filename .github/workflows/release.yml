name: Release recovery / v0.0.18

on:
  workflow_dispatch:
    inputs:
      repeat_windows_plain:
        description: 在三个独立 Windows runner 上验证同一个普通版安装包
        type: boolean
        default: false

concurrency:
  group: release-refs/tags/v0.0.18
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: v0.0.18
  RELEASE_SOURCE_SHA: 31009aa32b7ffa180a0b9aec734918965564702e
  OFFICIAL_RUN_ID: '46140915767'

jobs:
  prepare:
    name: 校验发布版本
    if: github.ref == 'refs/heads/codex/release-v0.0.18-arm-recovery'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.versions.outputs.app_version }}
      node_ver: ${{ steps.versions.outputs.node_ver }}
      dsh_version: ${{ steps.versions.outputs.dsh_version }}
      pnpm_version: ${{ steps.versions.outputs.pnpm_version }}
      macos_intel: ${{ steps.reuse.outputs.macos_intel }}
      linux: ${{ steps.reuse.outputs.linux }}
      windows: ${{ steps.reuse.outputs.windows }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - name: 读取 App 和运行时版本
        id: versions
        shell: python
        run: |
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          conf = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          package = json.loads(Path("package.json").read_text())
          cargo = tomllib.loads(Path("src-tauri/Cargo.toml").read_text())
          version = conf["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid application version: {version}")
          if version != package["version"] or version != cargo["package"]["version"]:
              raise SystemExit("App versions differ in tauri.conf.json, package.json and Cargo.toml")
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match v{version}")
          runtime = Path("scripts/bundle-runtime.mjs").read_text()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"app_version={version}", file=output)
              for key in ("NODE_VER", "DSH_VERSION", "PNPM_VERSION"):
                  match = re.search(rf"^const {key} = '([^'\r\n]+)'$", runtime, re.M)
                  if not match:
                      raise SystemExit(f"Missing {key} in bundle-runtime.mjs")
                  print(f"{key.lower()}={match[1]}", file=output)
          print(f"Application version: {version}")
      - name: Verify the tag and the three reusable build artifacts
        id: reuse
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["RELEASE_SOURCE_SHA"]
          run_id = int(os.environ["OFFICIAL_RUN_ID"])

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"]))

          ref = api(f"git/ref/tags/{tag}")["object"]
          target = api(f"git/tags/{ref['sha']}")["object"] if ref["type"] == "tag" else {}
          if target.get("type") != "commit" or target.get("sha") != sha:
              raise SystemExit("The annotated release tag no longer points to the approved commit")
          run = api(f"actions/runs/{run_id}")
          if (run["event"], run["head_branch"], run["head_sha"], run["path"].split("@", 1)[0]) != ("push", tag, sha, ".github/workflows/release.yml"):
              raise SystemExit("The source run does not belong to this tag and Release workflow")
          if run["status"] != "completed" or run["conclusion"] != "failure":
              raise SystemExit("The original Release must have ended with an unsuccessful build")

          artifacts = api(f"actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
          completed_jobs = {}
          with (open(os.environ["GITHUB_OUTPUT"], "a") as outputs,
                open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary):
              print(f"Release source: `{sha}` from `{tag}`. Reused [official run {run_id}](https://github.com/{repo}/actions/runs/{run_id}).", file=summary)
              for platform, runner in (("macos_intel", "macos-26-intel"), ("linux", "ubuntu-26.04"), ("windows", "windows-2025")):
                  valid = []
                  for artifact in artifacts:
                      match = re.fullmatch(rf"release-{re.escape(runner)}-([1-9][0-9]*)", artifact["name"])
                      if (not match or artifact["expired"] or artifact["size_in_bytes"] <= 0
                              or not re.fullmatch(r"sha256:[0-9a-f]{64}", artifact.get("digest") or "")):
                          continue
                      if any(artifact["workflow_run"].get(key) != value for key, value in (("id", run_id), ("head_sha", sha), ("head_branch", tag))):
                          raise SystemExit(f"Unexpected provenance for {artifact['name']}")
                      attempt = int(match[1])
                      if attempt not in completed_jobs:
                          completed_jobs[attempt] = api(f"actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")["jobs"]
                      if any(job["name"] == f"构建 / {runner}" and job["conclusion"] == "success"
                             and any(step["name"] == "上传安装包" and step["conclusion"] == "success" for step in job["steps"])
                             for job in completed_jobs[attempt]):
                          valid.append((attempt, artifact["id"]))
                  if not valid:
                      raise SystemExit(f"No completed build artifact for {runner}")
                  _, artifact_id = max(valid)
                  print(f"{platform}={artifact_id}", file=outputs)
                  print(f"Reusing official {runner} artifact {artifact_id}")
                  print(f"- {runner}: artifact {artifact_id}", file=summary)

  build:
    name: 构建 / ${{ matrix.platform }}
    needs: prepare
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    outputs:
      macos_arm: ${{ steps.artifact.outputs.macos_arm }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: xcode-27
            key: macos_arm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - name: Check out the recovery packaging helper
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: recovery-tools
          sparse-checkout: scripts/build-release.sh
          sparse-checkout-cone-mode: false

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # 与根目录 rust-toolchain.toml 同步，确保组件装入 cargo 实际使用的工具链。
          toolchain: '1.100.0'
          components: rustfmt, clippy

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: 安装 pnpm
        # 从根目录 package.json 读取构建工具版本，并按 pnpm-lock.yaml 缓存 store。
        uses: pnpm/setup@v3.2.0
        with:
          cache: true
          install: false

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 内置 Node.js 运行时缓存：key 由版本常量 + 架构 + 生成脚本内容决定，
      # 命中直接用；未命中则本次生成后存入。注意不设 restore-keys 兜底，
      # 避免恢复出旧版本 runtime——版本漂移时 build-release.sh 会比较 manifest 重建。
      # key 必须含 matrix.platform：darwin-x64 与 linux-x64 的 arch 都是 x86_64，
      # 不带平台会互相抢同一个缓存键（每次各白重建一轮）+ 依赖时序互相覆盖。
      - name: 缓存内置 Node.js 运行时
        # Node24 runtime 版本
        uses: actions/cache@v6
        with:
          path: src-tauri/resources/runtime
          key: dsh-runtime-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.prepare.outputs.node_ver }}-${{ needs.prepare.outputs.dsh_version }}-${{ needs.prepare.outputs.pnpm_version }}-${{ hashFiles('scripts/bundle-runtime.mjs') }}

      - name: 运行 Rust 单元测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 依赖安全审计（cargo audit）
        # 官方最新 tag 仍用已弃用的 node20 runtime，故锁定到 main 分支上已
        # 升级 node24 runtime 的 commit（官方发新版 tag 后可切回 @vX）。
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Cargo.lock 位于 src-tauri/ 下（Tauri 工程），不在仓库根目录
          working-directory: src-tauri
          # 忽略以下 17 个「无维护/unsound」类 informational 警告（均为 Tauri v2
          # 上游锁定依赖，应用层无法升级，升级 Tauri 后应随之移除）：
          #  - RUSTSEC-2024-0413/0416/0412/0418/0411/0417/0414/0415/0420/0419：
          #    gtk-rs GTK3 bindings（atk/gdk/gtk/gdkx11/gdkwayland 等），Tauri 在
          #    Linux 依赖 webkit2gtk-4.1 引入，官方未提供可替换的 GTK4 绑定
          #  - RUSTSEC-2024-0370：proc-macro-error（gtk3-macros 传递依赖）
          #  - RUSTSEC-2025-0081/0075/0080/0100/0098：unic-*（urlpattern → tauri-utils 传递依赖）
          #  - RUSTSEC-2024-0429：glib VariantStrIter 内存安全（需 >=0.20，但 gtk 0.18
          #    配套锁定 glib 0.18；本项目未使用该 API，风险不可达）
          # 新出现的漏洞（vulnerabilities）不受影响，仍会失败阻止发布。
          ignore: RUSTSEC-2024-0413,RUSTSEC-2024-0416,RUSTSEC-2024-0412,RUSTSEC-2024-0418,RUSTSEC-2024-0411,RUSTSEC-2024-0417,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0420,RUSTSEC-2024-0419,RUSTSEC-2024-0370,RUSTSEC-2025-0081,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0100,RUSTSEC-2025-0098,RUSTSEC-2024-0429

      - name: 代码风格与静态检查
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      # 前端质量门禁：ESLint（含 XSS 相关规则）+ Prettier 格式校验。
      # 原先只有 `node --check`（仅语法校验，查不出未定义变量、死代码、
      # innerHTML 拼接等问题）。ui/ 虽无打包器，但脚本量已上千行，
      # 需要真正的 lint 来兜住质量。依赖由「安装依赖」步骤的 pnpm install 提供。
      - name: 前端代码检查（ESLint）
        run: pnpm run lint

      - name: 前端格式检查（Prettier）
        run: pnpm run format:check

      # ui/ 是纯静态前端（frontendDist: ../ui），无需单独构建；
      # tauri build 按 runner 宿主架构自动产出对应架构产物。
      # 双版本：plain（现状，无内置运行时）+ bundled（内置 Node.js，离线可用）。
      # two 模式每轮构建后立即归档到 dist/release/{plain,bundled}，避免共用一个
      # target/release/bundle 输出目录而互相覆盖；bundled 首跑会自动下载 Node 并
      # npm ci 安装 dsh（scripts/bundle-runtime.mjs），产物命名加 -bundled 后缀区分。
      # 只替换打包脚本，使用固定 tag 源码及正式发布的遥测设置。
      - name: 构建双版本（plain + bundled）
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DSH_STAGE_MACOS_DMG: '1'
          # Tauri 仅在详细日志中输出 DMG 脚本的 stdout 和 stderr。
          TAURI_BUILD_VERBOSE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          cp recovery-tools/scripts/build-release.sh scripts/build-release.sh
          bash scripts/build-release.sh two

      - name: 整理安装包和 macOS ZIP
        shell: bash
        env:
          PLATFORM: ${{ matrix.key }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: python3 scripts/release-artifacts.py stage "$PLATFORM" "$APP_VERSION" release-files

      - name: 上传安装包
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ github.run_attempt }}
          path: release-files
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: 记录不可变的产物 ID
        id: artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.key }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          printf '%s=%s\n' "$PLATFORM" "$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

  integrity:
    name: 校验四平台产物完整性
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      official_artifact_ids: ${{ steps.ids.outputs.official }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - name: 检查产物 ID
        id: ids
        shell: bash
        env:
          MAC_ARM: ${{ needs.build.outputs.macos_arm }}
          MAC_INTEL: ${{ needs.prepare.outputs.macos_intel }}
          LINUX: ${{ needs.prepare.outputs.linux }}
          WINDOWS: ${{ needs.prepare.outputs.windows }}
        run: |
          ids="$MAC_ARM,$MAC_INTEL,$LINUX,$WINDOWS"
          [[ "$ids" =~ ^[0-9]+,[0-9]+,[0-9]+,[0-9]+$ ]]
          printf 'official=%s\n' "$MAC_INTEL,$LINUX,$WINDOWS" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.macos_arm }}
          path: release-files
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.OFFICIAL_RUN_ID }}
          artifact-ids: ${{ steps.ids.outputs.official }}
          path: release-files
          merge-multiple: true
          digest-mismatch: error
      - name: 检查 12 个预期附件
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: python3 scripts/release-artifacts.py verify "$APP_VERSION" release-files

  smoke:
    name: 冷启动 / ${{ matrix.runner }} / ${{ matrix.variant }}
    needs: [prepare, build, integrity]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macos_arm, macos_intel, linux, windows]
        variant: ${{ fromJSON(inputs.repeat_windows_plain && '["plain", "bundled", "plain-2", "plain-3"]' || '["plain", "bundled"]') }}
        exclude:
          - { platform: macos_arm, variant: plain-2 }
          - { platform: macos_arm, variant: plain-3 }
          - { platform: macos_intel, variant: plain-2 }
          - { platform: macos_intel, variant: plain-3 }
          - { platform: linux, variant: plain-2 }
          - { platform: linux, variant: plain-3 }
        include:
          # 用 macOS 26 和 Ubuntu 24.04 验证新镜像构建的安装包能在上一代系统运行。
          - platform: macos_arm
            runner: macos-26
            arch: aarch64
            dmg_arch: aarch64
          - platform: macos_intel
            runner: macos-26-intel
            arch: x86_64
            dmg_arch: x64
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      NODE_VERSION: ${{ needs.prepare.outputs.node_ver }}
      BUNDLED_DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
      VARIANT: ${{ startsWith(matrix.variant, 'plain') && 'plain' || 'bundled' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.platform == 'macos_arm' && github.run_id || env.OFFICIAL_RUN_ID }}
          artifact-ids: ${{ matrix.platform == 'macos_arm' && needs.build.outputs.macos_arm || needs.prepare.outputs[matrix.platform] }}
          path: release-files
          digest-mismatch: error
      - uses: actions/setup-node@v7
        if: env.VARIANT == 'plain'
        with:
          node-version: ${{ needs.prepare.outputs.node_ver }}
          package-manager-cache: false
      - name: Windows 安装和冷启动
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $suffix = if ($env:VARIANT -eq 'bundled') { '-bundled' } else { '' }
          $installer = Join-Path $PWD "release-files/DeepSeekHarness_${env:APP_VERSION}_x64-setup${suffix}.exe"
          & ./scripts/smoke-windows-installer.ps1 -Installer $installer -Variant $env:VARIANT `
            -AppVersion $env:APP_VERSION -NodeVersion $env:NODE_VERSION -BundledDshVersion $env:BUNDLED_DSH_VERSION
      - name: macOS 安装、ZIP 校验和冷启动
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DMG_ARCH: ${{ matrix.dmg_arch }}
        run: |
          suffix=""
          if [[ "$VARIANT" == bundled ]]; then suffix="-bundled"; fi
          dmg="$PWD/release-files/DeepSeekHarness_${APP_VERSION}_${DMG_ARCH}${suffix}.dmg"
          zip="$PWD/release-files/DeepSeek-Harness${suffix}-${ARCH}-v${APP_VERSION}.zip"
          bash scripts/smoke-macos-installer.sh "$dmg" "$APP_VERSION" "$PWD/screenshots/macos-$ARCH-$VARIANT.png" "$VARIANT" "$zip"
      - uses: actions/upload-artifact@v7
        if: ${{ always() && runner.os == 'macOS' }}
        with:
          name: page-macos-${{ matrix.arch }}-${{ matrix.variant }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Ubuntu 24.04 安装和冷启动
        if: runner.os == 'Linux'
        shell: bash
        run: |
          suffix=""
          if [[ "$VARIANT" == bundled ]]; then suffix="-bundled"; fi
          deb="$PWD/release-files/DeepSeekHarness_${APP_VERSION}_amd64${suffix}.deb"
          bash scripts/smoke-linux-installer.sh "$deb" "$VARIANT" "$APP_VERSION" "$NODE_VERSION" "$BUNDLED_DSH_VERSION"

  publish:
    name: 统一发布 GitHub Release
    if: ${{ success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-v0.0.18-arm-recovery' }}
    needs: [prepare, build, integrity, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.macos_arm }}
          path: release-files
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.OFFICIAL_RUN_ID }}
          artifact-ids: ${{ needs.integrity.outputs.official_artifact_ids }}
          path: release-files
          merge-multiple: true
          digest-mismatch: error
      - name: 核对产物并发布
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag_object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq '.object.sha')" = "$RELEASE_SOURCE_SHA"
          python3 scripts/release-artifacts.py verify "$APP_VERSION" release-files
          bash scripts/publish-release.sh "$RELEASE_TAG" release-files
